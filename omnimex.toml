# Omnimex Configuration (zero-cost local-first defaults)

[app]
host = "127.0.0.1"
port = 8765
log_level = "info"

[storage]
db_path = "data/omnimex.db"
memories_dir = "data/memories"
wal_mode = true
busy_timeout_ms = 5000

[embedding]
# "auto" uses local ONNX fastembed when cached (or downloadable when allow_download=true),
# and falls back deterministically offline so tests and air-gapped runs never hang.
provider = "auto"
model = "BAAI/bge-small-en-v1.5"
dimension = 384
cache_dir = "data/fastembed_cache"
batch_size = 32
allow_download = false

[distiller]
# Zero-cost heuristic extractor by default.
# Switch to "ollama" (local LLM) or "openai_compatible" anytime without re-ingesting.
provider = "heuristic"
auto_distill_on_scan = true
timeout_seconds = 30.0
# model = "qwen2.5:7b-instruct"
# base_url = "http://127.0.0.1:11434/v1"

[adapters]
watch_enabled = true
watch_debounce_ms = 2000
scan_on_startup = true
enabled = [
  "antigravity",
  "claude_code",
  "codex",
  "cursor",
  "gemini_cli",
  "windsurf",
  "cline",
  "roo_code",
  "copilot",
  "opencode",
  "aider",
]

[redaction]
enabled = true
